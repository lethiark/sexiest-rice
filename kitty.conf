# Nano is a command-line text editor that was released in 1999 as a free software replacement for Pico
# following licensing issues with Pico. It was renamed to Nano in 2000 and became part of the GNU project in 2001
# making it widely available on Linux distributions.
# Unlike Pico, nano is licensed under the GNU General Public License,
# and its logo resembles the lowercase greek letter Eta (η)
# more on " https://en.wikipedia.org/wiki/GNU_nano "

# Windows and Opacity
hide_window_decoration no      # change to ' no ' to ' yes ' if you don't want the window frame
window_padding_width 8
remember_window_position yes
remember_window_size yes
initial_window_width  640
initial_window_height 400
confirm_window_close 0
background_opacity 0.4
background_blur 0

# Fonts :
#: kitty has very powerful font management. You can configure
#: individual font faces and even specify special fonts for particular
#: characters...

font_size 8.0
# force_ltr no
font_family      Iosevka
# bold_font        auto
# italic_font      auto
# bold_italic_font auto

# Tabs
tab_bar_margin_width 0.2
tab_bar_margin_height 0.2 0.2
tab_bar_style fade


# BEGIN_KITTY_THEME
# Black Metal
include current-theme.conf
# END_KITTY_THEME
